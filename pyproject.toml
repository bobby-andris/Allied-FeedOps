# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedops"
version = "0.1.0"
description = "Allied FeedOps - Merchant Center feed optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.84.0",
    "google-ads>=28.4.1",
    "google-genai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.30",
    "google-auth>=2.48.0",
    "gspread>=6.0",
    "google-api-python-client>=2.0",
    "supabase>=2.0",
    "scipy>=1.10",
    "bingads>=13.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.20",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
feedops = "feedops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/feedops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:warn_ungrouped_named_tokens_in_collection.*:pyparsing.warnings.PyparsingDiagnosticWarning",
    "ignore:'enablePackrat' deprecated - use 'enable_packrat':pyparsing.warnings.PyparsingDeprecationWarning",
    "ignore:'enablePackrat' deprecated - use 'enable_packrat':Warning:pyiceberg.expressions.parser",
    "ignore:'escChar' argument is deprecated, use 'esc_char':Warning:pyiceberg.expressions.parser",
    "ignore:'unquoteResults' argument is deprecated, use 'unquote_results':Warning:pyiceberg.expressions.parser",
    "ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated.*:DeprecationWarning:pyiceberg.table.metadata",
]

[tool.ruff]
line-length = 100
target-version = "py311"

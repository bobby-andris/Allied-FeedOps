# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedops"
version = "0.1.0"
description = "Allied FeedOps - Merchant Center feed optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "google-ads>=28.4.1",
    "google-genai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.30",
    "google-auth>=2.48.0",
    "gspread>=6.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
feedops = "feedops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/feedops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

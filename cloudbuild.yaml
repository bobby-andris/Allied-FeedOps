# Cloud Build configuration for FeedOps Pipeline
# Triggered on push to master branch

steps:
  # Pre-deploy parity gate: fail the build if production contract tests fail.
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        python -m pip install --no-cache-dir -r requirements.txt pytest
        ./scripts/verify_cloud_run_parity.sh

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'feedops-pipeline'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--set-secrets'
      - 'OPENAI_API_KEY=feedops-openai-api-key:latest,SUPABASE_URL=feedops-supabase-url:latest,SUPABASE_KEY=feedops-supabase-key:latest,GOOGLE_ADS_DEVELOPER_TOKEN=feedops-google-ads-developer-token:latest,GOOGLE_ADS_CLIENT_ID=feedops-google-ads-client-id:latest,GOOGLE_ADS_CLIENT_SECRET=feedops-google-ads-client-secret:latest,GOOGLE_ADS_REFRESH_TOKEN=feedops-google-ads-refresh-token:latest,GOOGLE_ADS_LOGIN_CUSTOMER_ID=feedops-google-ads-login-customer-id:latest,GEMINI_API_KEY=feedops-gemini-api-key:latest,SLACK_WEBHOOK_URL=feedops-slack-webhook-url:latest'
      - '--set-env-vars'
      - 'GOOGLE_ADS_CUSTOMER_ID=6253381786,GOOGLE_ADS_API_ENABLED=1'
      - '--service-account'
      - 'profit-pilot-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '900'
      - '--max-instances'
      - '10'

# Store images in Artifact Registry
images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/feedops-pipeline:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Substitutions (can be overridden)
substitutions:
  _REGION: us-east1

# Timeout for the entire build
timeout: '1200s'

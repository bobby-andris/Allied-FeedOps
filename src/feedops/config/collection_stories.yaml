    design_aesthetic: >
      Bold architectural geometry with perfectly square backplates and sharply defined
      cubic end pieces. Uncompromising 90-degree angles and precise proportions create
      the crisp minimalist presence that contemporary design demands.
    style_category: "Contemporary/Modern"
    target_buyer: "Modern minimalists, urban loft dwellers, architects specifying clean-line hardware for contemporary new builds."
    content_examples:

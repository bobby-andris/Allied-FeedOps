collection_preamble: >
  Allied Brass offers 41 coordinated designer collections — each a complete
  design system of matching accessories in 28 finishes. No competitor at this
  price tier offers coordinated collections. Use the collection identity to
  differentiate this product, suggest coordination with other pieces, and
  address the "will this match?" anxiety that kills conversions.

# ---------------------------------------------------------------------------
# PER-COLLECTION STORYTELLING PROFILES
# ---------------------------------------------------------------------------

collections:


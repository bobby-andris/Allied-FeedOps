# === FINISH COMPARISON QUICK REFERENCE ===
# Used when positioning a finish relative to alternatives in descriptions.
#
# Polished Chrome vs Polished Nickel:
#   Chrome = cool silver (blue undertones), Nickel = warm silver (golden undertones)
#
# Satin Brass vs Unlacquered Brass:
#   Satin = fixed brushed golden finish, Unlacquered = living finish that evolves
#
# Oil Rubbed Bronze vs Venetian Bronze:
#   ORB = darker (deep brown-black + copper highlights), Venetian = warmer and lighter
#
# Polished Brass vs Satin Brass:
#   Polished = mirror-like/traditional/high-shine, Satin = brushed/modern/low-maintenance
#
# Matte Black vs Matte Gray:
#   Black = high contrast (bold), Gray = low contrast (quiet sophistication)
#
# Antique Pewter vs Satin Nickel:
#   Pewter = warmer/grayer/more aged, Satin Nickel = brighter/more neutral/more contemporary
